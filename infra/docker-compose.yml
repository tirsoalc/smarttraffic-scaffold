version: '3.8'

services:
  smarttraffic-db:
    image: postgres:15-alpine
    container_name: smarttraffic-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarttraffic
    ports:
      - "5432:5432"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8100:80"
    networks:
      - backend-network
    depends_on:
      - smarttraffic-db

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data: